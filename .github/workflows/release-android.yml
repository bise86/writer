name: Android release

# Android packages are published only when a version tag is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk EssayLens-${GITHUB_REF_NAME}-android.apk

      - name: Create GitHub release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: EssayLens-${{ github.ref_name }}-android.apk
          generate_release_notes: true
