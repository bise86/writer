name: Android release

# Android packages are published only when a version tag is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore and validate permanent Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/prepare-android-signing.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify permanent APK certificate
        run: bash scripts/verify-android-signature.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Rename artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk EssayLens-${GITHUB_REF_NAME}-android.apk

      - name: Create GitHub release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: EssayLens-${{ github.ref_name }}-android.apk
          generate_release_notes: true

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          if [[ -n "${ESSAY_SIGNING_DIR:-}" ]]; then
            rm -rf -- "${ESSAY_SIGNING_DIR}"
          fi
